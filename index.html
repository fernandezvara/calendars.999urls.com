<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                 font-src 'self' https://fonts.gstatic.com;
                 script-src 'self' 'unsafe-eval'; 
                 img-src 'self' data: blob:;">
  <title>Customizable Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Raleway:wght@400;700&family=Poppins:wght@400;700&family=Dancing+Script:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-4hHR0kj9.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DcrOIOuf.css">
</head>
<body x-data="calendarApp" x-cloak>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-content">
      <div class="nav-left">
        <h1 class="app-title" x-text="t('ui.appTitle')"></h1>
        <input 
          type="text" 
          x-model="projectName" 
          :placeholder="t('ui.projectNamePlaceholder')"
          class="project-name-input">
      </div>
      
      <div class="nav-center">
        <label>
          <span x-text="t('ui.year')"></span>
          <input type="number" x-model.number="year" min="2000" max="2100" class="year-input">
        </label>
        
        <label>
          <span x-text="t('ui.language')"></span>
          <select x-model="language" @change="changeLanguage()" class="language-select">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </label>
      </div>
      
      <div class="nav-right">
        <button @click="saveProject()" class="btn btn-primary" :disabled="isSaving">
          <span x-text="isSaving ? t('ui.saving') : t('ui.saveProject')"></span>
        </button>
        <button @click="$refs.importInput.click()" class="btn btn-secondary">
          <span x-text="t('ui.importProject')"></span>
        </button>
        <input type="file" x-ref="importInput" @change="importProject($event)" accept=".json" style="display: none;">
        <button @click="exportProject()" class="btn btn-secondary">
          <span x-text="t('ui.exportProject')"></span>
        </button>
      </div>
    </div>
    
    <div class="nav-status" x-show="lastSaved">
      <span x-text="t('ui.lastSaved') + ': ' + formatTime(lastSaved)"></span>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- View Toggle -->
    <div class="view-toggle">
      <button 
        @click="currentView = 'edit'" 
        :class="{'active': currentView === 'edit'}"
        class="btn"
        x-text="t('ui.edit')">
      </button>
      <button 
        @click="currentView = 'preview'" 
        :class="{'active': currentView === 'preview'}"
        class="btn"
        x-text="t('ui.preview')">
      </button>
    </div>

    <!-- Edit View -->
    <div x-show="currentView === 'edit'" class="edit-view">
      <!-- Image Manager Panel -->
      <div class="panel image-manager-panel">
        <h2 x-text="t('ui.imageManager')"></h2>
        
        <div class="upload-zone" 
             @drop.prevent="handleDrop($event)"
             @dragover.prevent="dragOver = true"
             @dragleave.prevent="dragOver = false"
             :class="{'drag-over': dragOver}">
          <input type="file" 
                 x-ref="imageInput" 
                 multiple 
                 accept="image/*" 
                 @change="handleUpload($event)"
                 style="display: none;">
          <button @click="$refs.imageInput.click()" class="btn btn-primary">
            <span x-text="t('ui.uploadImage')"></span>
          </button>
          <p x-text="t('ui.dragDropHint')"></p>
        </div>
        
        <div class="image-grid">
          <!-- Front Page -->
          <div class="image-slot">
            <div class="month-label" x-text="t('ui.frontPage')"></div>
            <template x-if="frontPageImage && getImageById(frontPageImage)">
              <div class="image-preview">
                <img :src="getImageById(frontPageImage).preview" :alt="t('ui.frontPage')">
                <button @click="frontPageImage = null" class="btn-remove" :title="t('ui.remove')">×</button>
              </div>
            </template>
            <template x-if="!frontPageImage || !getImageById(frontPageImage)">
              <div class="image-placeholder">
                <select x-model="frontPageImage" class="assign-select">
                  <option :value="null" x-text="t('ui.disabled')"></option>
                  <template x-for="img in images" :key="img.id">
                    <option :value="img.id" x-text="img.fileName"></option>
                  </template>
                </select>
              </div>
            </template>
          </div>
          
          <!-- Monthly Pages -->
          <template x-for="month in 12" :key="month">
            <div class="image-slot">
              <div class="month-label" x-text="t('months')[month - 1]"></div>
              <template x-if="getImageForMonth(month)">
                <div class="image-preview">
                  <img :src="getImageForMonth(month).preview" :alt="t('months')[month - 1]">
                  <button @click="removeImageFromMonth(month)" class="btn-remove" :title="t('ui.remove')">×</button>
                </div>
              </template>
              <template x-if="!getImageForMonth(month)">
                <div class="image-placeholder">
                  <select @change="assignImageToMonth($event.target.value, month); $event.target.value = ''" class="assign-select">
                    <option value="" x-text="t('ui.selectImage')"></option>
                    <template x-for="img in unassignedImages" :key="img.id">
                      <option :value="img.id" x-text="img.fileName"></option>
                    </template>
                  </select>
                </div>
              </template>
            </div>
          </template>
          
          <!-- Year Calendar Page -->
          <div class="image-slot">
            <div class="month-label" x-text="t('ui.yearCalendar')"></div>
            <div class="image-placeholder">
              <select x-model="yearCalendarEnabled" class="assign-select">
                <option value="disabled" x-text="t('ui.disabled')"></option>
                <option value="same" x-text="t('ui.sameYear')"></option>
                <option value="next" x-text="t('ui.nextYear')"></option>
              </select>
            </div>
          </div>
          
          <!-- Back Page -->
          <div class="image-slot">
            <div class="month-label" x-text="t('ui.backPage')"></div>
            <template x-if="backPageImage && getImageById(backPageImage)">
              <div class="image-preview">
                <img :src="getImageById(backPageImage).preview" :alt="t('ui.backPage')">
                <button @click="backPageImage = null" class="btn-remove" :title="t('ui.remove')">×</button>
              </div>
            </template>
            <template x-if="!backPageImage || !getImageById(backPageImage)">
              <div class="image-placeholder">
                <select x-model="backPageImage" class="assign-select">
                  <option :value="null" x-text="t('ui.disabled')"></option>
                  <template x-for="img in images" :key="img.id">
                    <option :value="img.id" x-text="img.fileName"></option>
                  </template>
                </select>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Calendar Editor Panel -->
      <div class="panel calendar-editor-panel">
        <h2 x-text="t('ui.calendarEditor')"></h2>
        
        <!-- Calendar Settings -->
        <div class="calendar-settings">
          <h3 x-text="t('ui.calendarSettings')"></h3>
          
          <label>
            <span x-text="t('ui.firstDayOfWeek')"></span>
            <select x-model.number="firstDayOfWeek" class="settings-select">
              <option :value="0" x-text="t('ui.sunday')"></option>
              <option :value="1" x-text="t('ui.monday')"></option>
              <option :value="2" x-text="t('ui.tuesday')"></option>
              <option :value="3" x-text="t('ui.wednesday')"></option>
              <option :value="4" x-text="t('ui.thursday')"></option>
              <option :value="5" x-text="t('ui.friday')"></option>
              <option :value="6" x-text="t('ui.saturday')"></option>
            </select>
          </label>
          
          <label>
            <span x-text="t('ui.dayNameLength')"></span>
            <select x-model.number="dayNameLength" class="settings-select">
              <option :value="1" x-text="t('ui.oneLetterDay')"></option>
              <option :value="2" x-text="t('ui.twoLetterDay')"></option>
              <option :value="3" x-text="t('ui.threeLetterDay')"></option>
            </select>
          </label>
        </div>
        
        <select x-model.number="selectedMonth" class="month-select">
          <template x-for="(month, idx) in t('months')" :key="idx">
            <option :value="idx" x-text="month"></option>
          </template>
        </select>
        
        <div class="calendar-grid-editor">
          <template x-for="day in getDayNames()" :key="day">
            <div class="day-name-header" x-text="day"></div>
          </template>
          
          <template x-for="date in getMonthDatesForEditor()" :key="date ? date.toISOString() : Math.random()">
            <div class="date-cell-editor" 
                 @click="date && openNoteEditor(date)"
                 :class="{
                   'weekend': date && isWeekend(date),
                   'has-note': date && hasNote(date),
                   'today': date && isToday(date),
                   'empty': !date
                 }">
              <span class="date-number" x-text="date ? date.getDate() : ''"></span>
              <span class="note-indicator" x-show="date && hasNote(date)">●</span>
            </div>
          </template>
        </div>
      </div>

      <!-- Style Customizer Panel -->
      <div class="panel style-panel">
        <h2 x-text="t('ui.styleCustomizer')"></h2>
        
        <div class="style-section">
          <h3 x-text="t('ui.template')"></h3>
          <div class="template-selector">
            <button @click="template = 'top'" 
                    :class="{'active': template === 'top'}"
                    class="btn btn-template"
                    x-text="t('ui.templateTop')">
            </button>
            <button @click="template = 'overlay'" 
                    :class="{'active': template === 'overlay'}"
                    class="btn btn-template"
                    x-text="t('ui.templateOverlay')">
            </button>
          </div>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.colors')"></h3>
          <div class="color-controls">
            <div class="color-item">
              <span x-text="t('ui.textColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.textColor">
                <input type="range" x-model.number="styles.textColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.textColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.dateColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.dateColor">
                <input type="range" x-model.number="styles.dateColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.dateColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.weekendColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.weekendColor">
                <input type="range" x-model.number="styles.weekendColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.weekendColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.monthHeaderColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.monthHeaderColor">
                <input type="range" x-model.number="styles.monthHeaderColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.monthHeaderColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.dayNameColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.dayNameColor">
                <input type="range" x-model.number="styles.dayNameColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.dayNameColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.noteColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.noteColor">
                <input type="range" x-model.number="styles.noteColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.noteColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.cellBgColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.cellBgColor">
                <input type="range" x-model.number="styles.cellBgOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.cellBgOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.cellBorderColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.cellBorderColor">
                <input type="range" x-model.number="styles.cellBorderColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.cellBorderColorOpacity"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.fonts')"></h3>
          <label>
            <span x-text="t('ui.fontFamily')"></span>
            <select x-model="styles.fontFamily">
              <optgroup label="System Fonts">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="Verdana">Verdana</option>
              </optgroup>
              <optgroup label="Google Fonts">
                <option value="Roboto">Roboto</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Lato">Lato</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Raleway">Raleway</option>
                <option value="Poppins">Poppins</option>
                <option value="Dancing Script">Dancing Script</option>
                <option value="Pacifico">Pacifico</option>
              </optgroup>
            </select>
          </label>
          <label>
            <span x-text="t('ui.fontSize')"></span>
            <input type="number" x-model.number="styles.fontSize" min="8" max="24">
          </label>
          <label>
            <span x-text="t('ui.monthHeaderSize')"></span>
            <input type="number" x-model.number="styles.monthHeaderSize" min="16" max="48">
          </label>
          <label>
            <span x-text="t('ui.monthHeaderAlign')"></span>
            <select x-model="styles.monthHeaderAlign">
              <option value="left" x-text="t('ui.alignLeft')"></option>
              <option value="center" x-text="t('ui.alignCenter')"></option>
              <option value="right" x-text="t('ui.alignRight')"></option>
            </select>
          </label>
          <label>
            <span x-text="t('ui.monthHeaderTransform')"></span>
            <select x-model="styles.monthHeaderTransform">
              <option value="normal" x-text="t('ui.textNormal')"></option>
              <option value="uppercase" x-text="t('ui.textUppercase')"></option>
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" x-model="styles.monthHeaderShadow">
            <span x-text="t('ui.monthHeaderShadow')"></span>
          </label>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.borders')"></h3>
          <label>
            <span x-text="t('ui.borderWidth')"></span>
            <input type="number" x-model.number="styles.cellBorderWidth" min="0" max="10">
          </label>
          <label>
            <span x-text="t('ui.borderStyle')"></span>
            <select x-model="styles.cellBorderStyle">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
              <option value="dotted">Dotted</option>
            </select>
          </label>
        </div>

        <div class="style-section" x-show="template === 'overlay'">
          <h3 x-text="t('ui.opacity')"></h3>
          <label>
            <span x-text="t('ui.imageOpacity')"></span>
            <input type="range" x-model.number="styles.overlayOpacity" min="0" max="1" step="0.1">
            <span x-text="styles.overlayOpacity"></span>
          </label>
          <label>
            <span x-text="t('ui.calendarOpacity')"></span>
            <input type="range" x-model.number="styles.calendarOpacity" min="0" max="1" step="0.1">
            <span x-text="styles.calendarOpacity"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Preview View -->
    <div x-show="currentView === 'preview'" class="preview-view">
      <div class="preview-main">
        <div class="print-container">
        
        <!-- Front Page -->
        <template x-if="frontPageImage">
          <div class="page">
            <template x-if="getImageById(frontPageImage)">
              <img :src="getImageById(frontPageImage).fullResolution" 
                   style="width: 100%; height: 100%; object-fit: cover;">
            </template>
            <template x-if="!getImageById(frontPageImage)">
              <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 2rem;">
                <span x-text="t('ui.frontPage')"></span>
              </div>
            </template>
          </div>
        </template>
        
        <!-- Monthly Pages -->
        <template x-for="month in 12" :key="month">
          <div class="page" 
               :class="'template-' + template">
            
            <!-- Template: Image Top -->
            <template x-if="template === 'top'">
              <div class="page-content">
                <div class="image-container">
                  <template x-if="getImageForMonth(month)">
                    <img :src="getImageForMonth(month).fullResolution" :alt="t('months')[month - 1]">
                  </template>
                  <template x-if="!getImageForMonth(month)">
                    <div class="no-image" x-text="t('ui.noImage')"></div>
                  </template>
                </div>
                <div class="calendar-container">
                  <h2 x-text="t('months')[month - 1]" :style="getMonthHeaderStyles()"></h2>
                  
                  <table class="calendar-table" :style="getTableStyles()">
                    <thead>
                      <tr>
                        <template x-for="day in getDayNames()" :key="day">
                          <th x-text="day" :style="getDayNameStyles()"></th>
                        </template>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(week, weekIdx) in getMonthWeeks(month)" :key="weekIdx">
                        <tr>
                          <template x-for="(date, idx) in week" :key="idx">
                            <td :style="getCellStyles(date)">
                              <span x-text="date ? date.getDate() : ''" 
                                    :style="getDateStyles(date)"></span>
                              <template x-if="date && hasNote(date)">
                                <div class="note" 
                                     :style="getNoteStyles(date)"
                                     x-text="getNote(date).text"></div>
                              </template>
                            </td>
                          </template>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
            
            <!-- Template: Image Overlay -->
            <template x-if="template === 'overlay'">
              <div class="page-content overlay-mode">
                <div class="background-image" 
                     :style="getBackgroundImageStyle(month)"></div>
                <div class="calendar-overlay" 
                     :style="{opacity: styles.calendarOpacity}">
                  <h2 x-text="t('months')[month - 1]" :style="getMonthHeaderStyles()"></h2>
                  
                  <table class="calendar-table" :style="getTableStyles()">
                    <thead>
                      <tr>
                        <template x-for="day in getDayNames()" :key="day">
                          <th x-text="day" :style="getDayNameStyles()"></th>
                        </template>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(week, weekIdx) in getMonthWeeks(month)" :key="weekIdx">
                        <tr>
                          <template x-for="(date, idx) in week" :key="idx">
                            <td :style="getCellStyles(date)">
                              <span x-text="date ? date.getDate() : ''" 
                                    :style="getDateStyles(date)"></span>
                              <template x-if="date && hasNote(date)">
                                <div class="note" 
                                     :style="getNoteStyles(date)"
                                     x-text="getNote(date).text"></div>
                              </template>
                            </td>
                          </template>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </template>
        
        <!-- Year Calendar Page -->
        <template x-if="yearCalendarEnabled !== 'disabled'">
          <div class="page year-calendar-page">
            <h1 x-text="getYearForYearCalendar()" :style="{...getMonthHeaderStyles(), textAlign: 'center', margin: '20px 0'}"></h1>
            <div class="year-calendar-grid">
              <template x-for="month in 12" :key="month">
                <div class="mini-month">
                  <h4 x-text="t('months')[month - 1]" :style="{...getMonthHeaderStyles(), fontSize: '14px', marginBottom: '5px', textAlign: 'center'}"></h4>
                  <table class="mini-calendar-table">
                    <thead>
                      <tr>
                        <template x-for="day in getDayNames()" :key="day">
                          <th x-text="day.substring(0, 1)" :style="{...getDayNameStyles(), fontSize: '10px', padding: '2px'}"></th>
                        </template>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(week, weekIdx) in getMonthWeeksForYearCalendar(month)" :key="weekIdx">
                        <tr>
                          <template x-for="(date, idx) in week" :key="idx">
                            <td :style="{...getCellStyles(date), padding: '2px', fontSize: '10px'}">
                              <span x-text="date ? date.getDate() : ''" :style="{...getDateStyles(date), fontSize: '10px'}"></span>
                            </td>
                          </template>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>
        
        <!-- Back Page -->
        <template x-if="backPageImage">
          <div class="page">
            <template x-if="getImageById(backPageImage)">
              <img :src="getImageById(backPageImage).fullResolution" 
                   style="width: 100%; height: 100%; object-fit: cover;">
            </template>
            <template x-if="!getImageById(backPageImage)">
              <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 2rem;">
                <span x-text="t('ui.backPage')"></span>
              </div>
            </template>
          </div>
        </template>
        
      </div>
    </div>
    
    <!-- Style Customizer Sidebar for Preview -->
    <div class="preview-sidebar">
      <div class="panel style-panel-preview">
        <h2 x-text="t('ui.styleCustomizer')"></h2>
        
        <div class="style-section">
          <h3 x-text="t('ui.pageSize')"></h3>
          <select x-model="pageSize" class="settings-select">
            <option value="a4" x-text="t('ui.pageSizeA4')"></option>
            <option value="a3" x-text="t('ui.pageSizeA3')"></option>
            <option value="letter" x-text="t('ui.pageSizeLetter')"></option>
          </select>
          <button @click="generatePDF()" class="btn btn-success btn-pdf">
            <span x-text="t('ui.generatePDF')"></span>
          </button>
        </div>
        
        <div class="style-section">
          <h3 x-text="t('ui.template')"></h3>
          <div class="template-selector">
            <button @click="template = 'top'" 
                    :class="{'active': template === 'top'}"
                    class="btn btn-template"
                    x-text="t('ui.templateTop')">
            </button>
            <button @click="template = 'overlay'" 
                    :class="{'active': template === 'overlay'}"
                    class="btn btn-template"
                    x-text="t('ui.templateOverlay')">
            </button>
          </div>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.colors')"></h3>
          <div class="color-controls">
            <div class="color-item">
              <span x-text="t('ui.textColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.textColor">
                <input type="range" x-model.number="styles.textColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.textColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.dateColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.dateColor">
                <input type="range" x-model.number="styles.dateColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.dateColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.weekendColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.weekendColor">
                <input type="range" x-model.number="styles.weekendColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.weekendColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.monthHeaderColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.monthHeaderColor">
                <input type="range" x-model.number="styles.monthHeaderColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.monthHeaderColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.dayNameColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.dayNameColor">
                <input type="range" x-model.number="styles.dayNameColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.dayNameColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.noteColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.noteColor">
                <input type="range" x-model.number="styles.noteColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.noteColorOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.cellBgColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.cellBgColor">
                <input type="range" x-model.number="styles.cellBgOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.cellBgOpacity"></span>
              </div>
            </div>
            <div class="color-item">
              <span x-text="t('ui.cellBorderColor')"></span>
              <div class="color-opacity-group">
                <input type="color" x-model="styles.cellBorderColor">
                <input type="range" x-model.number="styles.cellBorderColorOpacity" min="0" max="1" step="0.1">
                <span class="opacity-value" x-text="styles.cellBorderColorOpacity"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.fonts')"></h3>
          <label>
            <span x-text="t('ui.fontFamily')"></span>
            <select x-model="styles.fontFamily">
              <optgroup label="System Fonts">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="Verdana">Verdana</option>
              </optgroup>
              <optgroup label="Google Fonts">
                <option value="Roboto">Roboto</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Lato">Lato</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Raleway">Raleway</option>
                <option value="Poppins">Poppins</option>
                <option value="Dancing Script">Dancing Script</option>
                <option value="Pacifico">Pacifico</option>
              </optgroup>
            </select>
          </label>
          <label>
            <span x-text="t('ui.fontSize')"></span>
            <input type="number" x-model.number="styles.fontSize" min="8" max="24">
          </label>
          <label>
            <span x-text="t('ui.monthHeaderSize')"></span>
            <input type="number" x-model.number="styles.monthHeaderSize" min="16" max="48">
          </label>
          <label>
            <span x-text="t('ui.monthHeaderAlign')"></span>
            <select x-model="styles.monthHeaderAlign">
              <option value="left" x-text="t('ui.alignLeft')"></option>
              <option value="center" x-text="t('ui.alignCenter')"></option>
              <option value="right" x-text="t('ui.alignRight')"></option>
            </select>
          </label>
          <label>
            <span x-text="t('ui.monthHeaderTransform')"></span>
            <select x-model="styles.monthHeaderTransform">
              <option value="normal" x-text="t('ui.textNormal')"></option>
              <option value="uppercase" x-text="t('ui.textUppercase')"></option>
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" x-model="styles.monthHeaderShadow">
            <span x-text="t('ui.monthHeaderShadow')"></span>
          </label>
        </div>

        <div class="style-section">
          <h3 x-text="t('ui.borders')"></h3>
          <label>
            <span x-text="t('ui.borderWidth')"></span>
            <input type="number" x-model.number="styles.cellBorderWidth" min="0" max="10">
          </label>
          <label>
            <span x-text="t('ui.borderStyle')"></span>
            <select x-model="styles.cellBorderStyle">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
              <option value="dotted">Dotted</option>
            </select>
          </label>
        </div>

        <div class="style-section" x-show="template === 'overlay'">
          <h3 x-text="t('ui.opacity')"></h3>
          <label>
            <span x-text="t('ui.imageOpacity')"></span>
            <input type="range" x-model.number="styles.overlayOpacity" min="0" max="1" step="0.1">
            <span x-text="styles.overlayOpacity"></span>
          </label>
          <label>
            <span x-text="t('ui.calendarOpacity')"></span>
            <input type="range" x-model.number="styles.calendarOpacity" min="0" max="1" step="0.1">
            <span x-text="styles.calendarOpacity"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  </main>

  <!-- Note Editor Modal -->
  <div x-show="noteEditorOpen" 
       class="modal-overlay" 
       @click.self="closeNoteEditor()">
    <div class="modal-content">
      <h3 x-text="t('ui.editNote')"></h3>
      <p x-text="formatDateKey(editingDate)"></p>
      
      <label>
        <span x-text="t('ui.noteText')"></span>
        <input type="text" 
               x-model="currentNote.text" 
               :placeholder="t('ui.noteTextPlaceholder')"
               @keyup.enter="saveNote()">
      </label>
      
      <label>
        <span x-text="t('ui.noteColor')"></span>
        <input type="color" x-model="currentNote.color">
      </label>
      
      <div class="modal-actions">
        <button @click="saveNote()" class="btn btn-primary" x-text="t('ui.save')"></button>
        <button @click="deleteNote()" class="btn btn-danger" x-text="t('ui.delete')"></button>
        <button @click="closeNoteEditor()" class="btn btn-secondary" x-text="t('ui.cancel')"></button>
      </div>
    </div>
  </div>

  <!-- PDF Generation Overlay -->
  <div x-show="isGeneratingPDF" 
       class="pdf-overlay"
       x-transition:enter="fade-in"
       x-transition:leave="fade-out">
    <div class="pdf-loader">
      <div class="pdf-spinner"></div>
      <h3 x-text="t('ui.generatingPDF')"></h3>
      <div class="pdf-progress-bar">
        <div class="pdf-progress-fill" :style="`width: ${pdfProgress}%`"></div>
      </div>
      <p class="pdf-progress-text" x-text="`${pdfProgress}%`"></p>
    </div>
  </div>

</body>
</html>
